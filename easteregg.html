<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Eggplant!</title>
    <style>
        body {
            background-color: #f4f7ed;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            position: relative;
        }

        .photo-frame {
            position: relative;
            max-width: 85vw;
            max-height: 80vh;
            border: 8px solid #ffffff;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            border-radius: 4px;
            transform: rotate(-2deg); /* Gives it a "photo" feel */
            z-index: 1;
            background: white;
            padding: 10px;
        }

        .photo-frame img {
            display: block;
            max-width: 100%;
            max-height: 75vh;
            border-radius: 2px;
        }

        /* Floating Caption Styling */
        .floating-caption {
            position: absolute;
            font-size: 2.5rem;
            font-weight: bold;
            color: #1b4332;
            white-space: nowrap;
            text-shadow: 2px 2px 10px rgba(255,255,255,0.8);
            z-index: 10;
            pointer-events: none; /* Allows clicks to pass through to the image */
            animation: drift 15s linear infinite;
        }

        @keyframes drift {
            0% {
                top: 80%;
                left: -20%;
                transform: rotate(0deg);
            }
            25% {
                top: 20%;
                left: 30%;
                transform: rotate(10deg);
            }
            50% {
                top: 50%;
                left: 80%;
                transform: rotate(-5deg);
            }
            75% {
                top: 10%;
                left: 40%;
                transform: rotate(5deg);
            }
            100% {
                top: 80%;
                left: -20%;
                transform: rotate(0deg);
            }
        }

        /* Background decorations */
        .bg-emoji {
            position: absolute;
            font-size: 2rem;
            opacity: 0.3;
            z-index: 0;
        }
    </style>
</head>
<body>

    <div class="photo-frame">
        <img src="1.jpg" alt="Our Eggplant Photo">
    </div>

    <div class="floating-caption">Our Eggplant! 🥒❤️</div>

    <div class="bg-emoji" style="top:10%; left:10%;">🥒</div>
    <div class="bg-emoji" style="top:80%; left:85%;">✨</div>
    <div class="bg-emoji" style="top:15%; left:70%;">🌱</div>

</body>
</html>

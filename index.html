<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Dear Wife</title>
    <style>
        body {
            /* Creamy cauliflower white and leaf green gradient */
            background: linear-gradient(135deg, #f1f8e9 0%, #ffffff 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            touch-action: manipulation;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(76, 175, 80, 0.2);
            z-index: 2;
            /* Deep green border like the outer leaves */
            border: 4px solid #388e3c;
            max-width: 85%;
        }
        h1 { color: #1b5e20; font-size: 2.2rem; margin-bottom: 10px; }
        p { color: #4caf50; font-size: 1.2rem; margin-bottom: 20px; }
        #click-counter { 
            font-weight: bold; 
            color: #2e7d32; 
            font-size: 1rem; 
            background: #f1f8e9;
            padding: 5px 15px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 15px; 
        }
        
        .main-emoji {
            font-size: 60px; 
            display: inline-block;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            margin-bottom: 15px;
            user-select: none;
            filter: drop-shadow(0 5px 5px rgba(0,0,0,0.1));
        }

        .floating {
            position: absolute;
            user-select: none;
            z-index: 1;
            animation: floatUp 6s linear infinite;
            cursor: pointer;
        }
        @keyframes floatUp {
            0% { transform: translateY(110vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }
        button {
            background-color: #43a047;
            border: none;
            padding: 14px 28px;
            border-radius: 30px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, background 0.3s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        button:hover {
            background-color: #2e7d32;
            transform: scale(1.05);
        }
        #note-display { 
            margin-top: 20px; 
            font-style: italic; 
            color: #1b5e20; 
            min-height: 40px;
            line-height: 1.4;
        }
        .surprise-screen { 
            font-size: 2.5rem; 
            color: #1b5e20; 
            font-weight: bold; 
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>

    <div class="container" id="main-container">
        <div id="click-counter">Cauliflower Growth: <span id="score">0</span>/10</div><br>
        <div class="main-emoji" id="growth-emoji">🌱</div>
        <h1>I love you</h1>
        <p>Catch the water and sun to grow our <strong>Cauliflower</strong>!</p>
        <button onclick="showNote()">A message for you</button>
        <div id="note-display"></div>
    </div>

    <script>
        let clickCount = 0;
        let secretTapCount = 0;
        let lastTapTime = 0;
        let typedInput = "";

        const notes = [
            "You're going to be the best mom! 🤍",
            "Our little guy is so lucky to have you.",
            "I'm so proud of you my dear.",
            "I miss my dearie!",
            "Can't wait to meet our little cauliflower!",
            "You are my dear. ☀️"
        ];

        function showNote() {
            const display = document.getElementById('note-display');
            display.innerText = notes[Math.floor(Math.random() * notes.length)];
        }

        const growthEl = document.getElementById('growth-emoji');
        
        // Secret tap functionality
        growthEl.addEventListener('click', function() {
            const now = Date.now();
            if (now - lastTapTime < 500) {
                secretTapCount++;
            } else {
                secretTapCount = 1;
            }
            lastTapTime = now;

            if (secretTapCount === 5) {
                window.location.href = 'easteregg.html';
            }
        });

        function createFloatingElement() {
            const el = document.createElement('div');
            el.classList.add('floating');
            
            // Cauliflower survival needs: Water, Sun, Love, and Seedlings
            const items = ['💧', '☀️', '☁️', '🤍', '🥬', '🥦'];
            el.innerHTML = items[Math.floor(Math.random() * items.length)];
            el.style.left = Math.random() * 90 + 'vw';
            el.style.fontSize = (Math.random() * 20 + 25) + 'px';
            el.style.animationDuration = (Math.random() * 3 + 4) + 's';

            el.addEventListener('click', function() {
                clickCount++;
                if (clickCount > 10) clickCount = 10;
                
                document.getElementById('score').innerText = clickCount;
                
                // Visual growth logic
                let size = 60 + (clickCount * 10);
                growthEl.style.fontSize = size + 'px';
                
                // Growth Stages
                if (clickCount >= 3 && clickCount < 6) {
                    growthEl.innerHTML = '🌿'; // Growing leaves
                } else if (clickCount >= 6 && clickCount < 10) {
                    growthEl.innerHTML = '🥦'; // Starting to head (using broccoli as closest)
                } else if (clickCount === 10) {
                    growthEl.innerHTML = '🥗'; // Full harvest/Cauliflower vibe
                    setTimeout(triggerSurprise, 500);
                }

                this.innerHTML = '✨';
                setTimeout(() => this.remove(), 100);
            });

            document.body.appendChild(el);
            setTimeout(() => { if(el.parentElement) el.remove(); }, 6000);
        }

        function triggerSurprise() {
            const userTimezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
            let msg = userTimezone.includes("Australia") ? "Hello Mr. 415 GIG ATT 🤍" : "Hi Dear 🤍";
            
            document.body.innerHTML = `
                <div class="surprise-screen">
                    <div>🥦✨🤍</div>
                    <div style="margin-top:20px;">Fully Grown!</div>
                    <div style="font-size: 1.5rem; margin-top:10px;">${msg}</div>
                    <div style="color: #e91e63; margin-top:10px;">❤️</div>
                </div>`;
            document.body.style.backgroundColor = "#f1f8e9";
        }

        // Keyboard Easter Egg
        document.addEventListener('keyup', (e) => {
            typedInput += e.key.toUpperCase();
            if (typedInput.includes("CAULIFLOWER")) {
                window.location.href = 'easteregg.html';
            }
            if (typedInput.length > 30) typedInput = typedInput.substring(15);
        });

        // Start the garden floating elements
        setInterval(createFloatingElement, 700);
    </script>
</body>
</html>

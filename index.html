<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Dear Wife</title>
    <style>
        body {
            /* Updated to a soft zucchini-flesh cream/green */
            background-color: #f4f7ed; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            touch-action: manipulation;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(27, 67, 50, 0.15);
            z-index: 2;
            /* Zucchini skin dark green */
            border: 3px solid #1b4332;
            max-width: 80%;
        }
        h1 {
            color: #081c15; 
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        p {
            color: #2d6a4f;
            font-size: 1.4rem;
            line-height: 1.4;
            margin-bottom: 20px;
        }
        #click-counter {
            font-weight: bold;
            color: #40916c;
            font-size: 1.1rem;
            margin-bottom: 10px;
        }
        .main-emoji {
            font-size: 60px;
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        .floating {
            position: absolute;
            user-select: none;
            z-index: 1;
            animation: floatUp 6s linear infinite;
            cursor: pointer;
            transition: transform 0.2s;
        }
        @keyframes floatUp {
            0% { transform: translateY(110vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }
        button {
            /* Garden green button */
            background-color: #2d6a4f;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            color: white;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        button:hover {
            background-color: #1b4332;
            transform: scale(1.05);
        }
        #note-display {
            margin-top: 20px;
            font-style: italic;
            color: #1b4332;
            min-height: 30px;
            font-weight: 500;
        }
        .surprise-screen {
            font-size: 3.5rem;
            color: #081c15;
            font-weight: bold;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>

    <div class="container" id="main-container">
        <div id="click-counter">Harvested: <span id="score">0</span>/5</div>
        <div class="main-emoji">🥒✨🌱</div>
        <h1>I love you</h1>
        <p>Thanks for carrying our <strong>Zucchini</strong>.</p>
        
        <button onclick="showNote()">Click for a message</button>
        <div id="note-display"></div>
    </div>

    <script>
        let clickCount = 0;
        const notes = [
            "You're going to be the best mom",
            "I'm so proud of my dear",
            "I miss my dearie",
            "Can't wait to meet our little one",
            "You're my favorite Zucchini"
        ];

        function showNote() {
            const display = document.getElementById('note-display');
            const randomNote = notes[Math.floor(Math.random() * notes.length)];
            display.innerText = randomNote;
            
            display.style.animation = 'none';
            display.offsetHeight; 
            display.style.animation = 'bounce 0.5s ease';
        }

        function createFloatingElement() {
            const el = document.createElement('div');
            el.classList.add('floating');
            
            // Zucchini/Garden themed emojis
            const items = ['🥒', '🌱', '🌿', '🌻', '🍃', '🥗', '💚', '👩‍🌾'];
            el.innerHTML = items[Math.floor(Math.random() * items.length)];
            
            el.style.left = Math.random() * 100 + 'vw';
            el.style.fontSize = (Math.random() * 20 + 25) + 'px';
            el.style.animationDuration = (Math.random() * 3 + 4) + 's';

            el.addEventListener('mousedown', handleEmojiClick);
            
            document.body.appendChild(el);
            
            setTimeout(() => {
                if(el.parentElement) el.remove();
            }, 7000);
        }

        function handleEmojiClick() {
            clickCount++;
            document.getElementById('score').innerText = clickCount;
            
            this.innerHTML = '✨';
            setTimeout(() => this.remove(), 100);

            if (clickCount >= 5) {
                triggerSurprise();
            }
        }

        function triggerSurprise() {
            const userTimezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
            let message = "Hi Dear 🥒";

            if (userTimezone.includes("Australia")) {
                message = "Hello Mr. 415 GIG ATT 🥒";
            }

            document.body.innerHTML = `<div class="surprise-screen">${message}</div>`;
            document.body.style.backgroundColor = "#f4f7ed";
        }

        setInterval(createFloatingElement, 500);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Dear Wife</title>
    <style>
        body {
            /* Pineapple yellow and soft cream gradient */
            background: linear-gradient(135deg, #fffde7 0%, #fff176 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            touch-action: manipulation;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(46, 125, 50, 0.2);
            z-index: 2;
            /* Tropical Green border */
            border: 4px solid #4caf50;
            max-width: 85%;
        }
        h1 { color: #fbc02d; font-size: 2.2rem; margin-bottom: 10px; text-shadow: 1px 1px 0px #f57f17; }
        p { color: #33691e; font-size: 1.2rem; margin-bottom: 20px; }
        
        #click-counter { 
            font-weight: bold; 
            color: #ffffff; 
            font-size: 1rem; 
            background: #43a047;
            padding: 5px 15px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 15px; 
        }
        
        .main-emoji {
            font-size: 60px; 
            display: inline-block;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            margin-bottom: 15px;
            user-select: none;
            filter: drop-shadow(0 5px 5px rgba(0,0,0,0.1));
        }

        .floating {
            position: absolute;
            user-select: none;
            z-index: 1;
            animation: floatUp 6s linear infinite;
            cursor: pointer;
        }
        @keyframes floatUp {
            0% { transform: translateY(110vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }
        button {
            background-color: #fbc02d;
            border: none;
            padding: 14px 28px;
            border-radius: 30px;
            color: #1b5e20;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, background 0.3s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        button:hover {
            background-color: #fdd835;
            transform: scale(1.05);
        }
        #note-display { 
            margin-top: 20px; 
            font-style: italic; 
            color: #2e7d32; 
            min-height: 40px;
            line-height: 1.4;
        }
        .surprise-screen { 
            font-size: 2.5rem; 
            color: #fbc02d; 
            font-weight: bold; 
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>

    <div class="container" id="main-container">
        <div id="click-counter">Our little Pineapple Progress: <span id="score">0</span>/10</div><br>
        <div class="main-emoji" id="growth-emoji">🌱</div>
        <h1>I love you dearie</h1>
        <p>Catch the to grow our <strong>Dino-Pineapple</strong>!</p>
        <button onclick="showNote()">A message for you</button>
        <div id="note-display"></div>
    </div>

    <script>
        let clickCount = 0;
        let secretTapCount = 0;
        let lastTapTime = 0;
        let typedInput = "";

        const notes = [
            "You're going to be the best mom! 🤍",
            "Our little dino is so lucky to have you.",
            "Dougie did Pissing",
            "Hi Dear",
            "I miss my dearie! 🍍",
            "Can't wait to meet our little guy!",
            "You are my dear. ☀️"
        ];

        function showNote() {
            const display = document.getElementById('note-display');
            display.innerText = notes[Math.floor(Math.random() * notes.length)];
        }

        const growthEl = document.getElementById('growth-emoji');
        
        growthEl.addEventListener('click', function() {
            const now = Date.now();
            if (now - lastTapTime < 500) {
                secretTapCount++;
            } else {
                secretTapCount = 1;
            }
            lastTapTime = now;

            if (secretTapCount === 5) {
                window.location.href = 'easteregg.html';
            }
        });

        function createFloatingElement() {
            const el = document.createElement('div');
            el.classList.add('floating');
            
            // Themes: Dinosaurs, Pineapple/Tropical, and Love
            const items = ['🦖', '☀️', '🍍', '🤍', '🏝️', '✨', '🍃'];
            el.innerHTML = items[Math.floor(Math.random() * items.length)];
            el.style.left = Math.random() * 90 + 'vw';
            el.style.fontSize = (Math.random() * 20 + 25) + 'px';
            el.style.animationDuration = (Math.random() * 3 + 4) + 's';

            el.addEventListener('click', function() {
                clickCount++;
                if (clickCount > 10) clickCount = 10;
                
                document.getElementById('score').innerText = clickCount;
                
                let size = 60 + (clickCount * 12);
                growthEl.style.fontSize = size + 'px';
                
                // Growth Stages: Sprout -> Flower -> Pineapple -> Dino
                if (clickCount >= 3 && clickCount < 7) {
                    growthEl.innerHTML = '🌼'; // Flowering
                } else if (clickCount >= 7 && clickCount < 10) {
                    growthEl.innerHTML = '🍍'; // The Pineapple
                } else if (clickCount === 10) {
                    growthEl.innerHTML = '🦖'; // The Dino!
                    setTimeout(triggerSurprise, 500);
                }

                this.innerHTML = '✨';
                setTimeout(() => this.remove(), 100);
            });

            document.body.appendChild(el);
            setTimeout(() => { if(el.parentElement) el.remove(); }, 6000);
        }

        function triggerSurprise() {
            const userTimezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
            let msg = userTimezone.includes("Australia") ? "Hello Mr. 415 GIG ATT 🤍" : "Hi Dear 🤍";
            
            document.body.innerHTML = `
                <div class="surprise-screen">
                    <div>🦖🍍✨</div>
                    <div style="margin-top:20px;">You're Dino-mite!</div>
                    <div style="font-size: 1.5rem; margin-top:10px;">${msg}</div>
                    <div style="color: #4caf50; margin-top:10px;">❤️</div>
                </div>`;
            document.body.style.backgroundColor = "#fffde7";
        }

        document.addEventListener('keyup', (e) => {
            typedInput += e.key.toUpperCase();
            if (typedInput.includes("DINO")) {
                window.location.href = 'easteregg.html';
            }
            if (typedInput.length > 30) typedInput = typedInput.substring(15);
        });

        setInterval(createFloatingElement, 700);
    </script>
</body>
</html>
